name: Build Packs

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  repository_dispatch:
    types: [texturepacks]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node build.mjs
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packs manifest.json
          git diff --cached --quiet || (git commit -m "build packs from itzTheMeow/NinjaIOUtils@master" && git push)
